# Local-only: SQLite file + uploads live in this folder; no Postgres/Redis.
# The API is published on 127.0.0.1 only (it has no auth).
services:
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
